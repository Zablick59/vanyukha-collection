<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ВАНЮХА collection's</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff; --text-muted: #a0a0a0; --accent: #ff4757; }
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        
        header { padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; transition: all 0.3s ease; }
        .site-title { margin: 0; cursor: pointer; display: flex; flex-direction: row; align-items: baseline; }
        .vanyukha-text { font-weight: 900; font-size: 36px; text-transform: uppercase; letter-spacing: 2px; }
        .collections-text { font-family: 'Great Vibes', cursive; font-size: 42px; color: #ffffff; margin-left: 2px; }
        
        .rainbow-text { 
            background: linear-gradient(45deg, #ff5e5e, #ffb347, #ffde59, #38e54d, #00cbfd, #cb6ce6, #ff66c4); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            display: inline-block;
        }
        
        nav { display: flex; gap: 20px; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s ease; display: inline-block; }
        nav a:hover { color: var(--text-main); transform: scale(1.15); }
        nav a.active { background: linear-gradient(45deg, #ff5e5e, #ffb347, #ffde59, #38e54d, #00cbfd, #cb6ce6, #ff66c4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { padding: 40px 50px; transition: all 0.3s ease; }
        
        .search-wrapper { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .search-bar { display: flex; align-items: center; background-color: var(--card-bg); border: 1px solid #333; border-radius: 30px; padding: 12px 20px; width: 300px; height: 48px; transition: all 0.3s ease; }
        .search-bar:focus-within { width: 500px; border-color: #555; box-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
        .search-icon { width: 22px; height: 22px; min-width: 22px; }
        .search-input { background: transparent; border: none; outline: none; color: var(--text-main); font-family: inherit; font-weight: 600; font-size: 16px; width: 100%; margin-left: 12px; }
        .search-input::placeholder { color: #666; font-weight: 400; }
        
        .sort-wrapper { position: relative; }
        .sort-select { background-color: var(--card-bg); color: var(--text-main); border: 1px solid #333; border-radius: 30px; padding: 0 45px 0 20px; height: 48px; font-family: inherit; font-weight: 600; font-size: 14px; outline: none; cursor: pointer; appearance: none; transition: all 0.2s; }
        .sort-select:hover { border-color: #555; }
        .sort-arrow { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); font-size: 12px; }
        
        .section-title { font-weight: 900; font-size: 32px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        
        .card { background-color: var(--card-bg); border-radius: 16px; overflow: hidden; transition: transform 0.3s; cursor: pointer; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-10px); }
        .poster { width: 100%; height: auto; aspect-ratio: 2 / 3; object-fit: cover; }
        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .title { font-weight: 800; font-size: 18px; margin: 0 0 10px 0; line-height: 1.2; }
        .details { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        
        .rating-wrapper { margin-top: auto; display: flex; align-items: baseline; }
        .rating-star { font-size: 22px; margin-right: 5px; }
        .rating-value { font-weight: 900; font-size: 32px; }
        .rating-max { color: var(--text-muted); font-weight: 700; font-size: 16px; margin-left: 2px; }

        .tags-container { margin-bottom: 10px; }
        .tag { display: inline-block; background: #333; padding: 4px 8px; border-radius: 6px; font-size: 12px; margin-right: 5px; margin-bottom: 5px; font-weight: 600; }
        
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 20px 15px; gap: 15px; }
            .vanyukha-text { font-size: 28px; }
            .collections-text { font-size: 32px; }
            nav { width: 100%; justify-content: center; flex-wrap: wrap; gap: 10px 20px; }
            nav a { font-size: 14px; }
            .container { padding: 25px 15px; }
            .search-wrapper { flex-direction: column; gap: 15px; align-items: stretch; }
            .search-bar, .sort-wrapper, .sort-select { width: 100%; }
            .search-bar:focus-within { width: 100%; }
            .section-title { font-size: 26px; text-align: center; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .info { padding: 12px; }
            .title { font-size: 15px; }
            .rating-star { font-size: 18px; }
            .rating-value { font-size: 24px; }
            .rating-max { font-size: 12px; }
            .tag { font-size: 11px; padding: 3px 6px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="site-title" onclick="showSection('all')">
            <span class="vanyukha-text rainbow-text">ВАНЮХА</span>
            <span class="collections-text">collection's</span>
        </div>
        <nav>
            <a id="btn-all" class="active" onclick="showSection('all')">ВСЁ</a>
            <a id="btn-movies" onclick="showSection('movies')">ФИЛЬМЫ И СЕРИАЛЫ</a>
            <a id="btn-games" onclick="showSection('games')">ИГРЫ</a>
        </nav>
    </header>

    <div class="container">
        <div class="search-wrapper">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="rainbow-svg" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff5e5e" />
                            <stop offset="20%" stop-color="#ffb347" />
                            <stop offset="40%" stop-color="#ffde59" />
                            <stop offset="60%" stop-color="#38e54d" />
                            <stop offset="80%" stop-color="#00cbfd" />
                            <stop offset="100%" stop-color="#cb6ce6" />
                        </linearGradient>
                    </defs>
                    <circle cx="11" cy="11" r="8" stroke="url(#rainbow-svg)"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="url(#rainbow-svg)"></line>
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Найти фильм или игру..." autocomplete="off">
            </div>

            <div class="sort-wrapper">
                <select id="sort-select" class="sort-select" onchange="refreshGrid()">
                    <option value="date-desc">Сначала новые (пройденные/просмотренные)</option>
                    <option value="date-asc">Сначала старые (пройденные/просмотренные)</option>
                    <option value="rating-desc">Высокий рейтинг (от 10 к 1)</option>
                    <option value="rating-asc">Низкий рейтинг (от 1 к 10)</option>
                    <option value="year-desc">Свежие релизы (по году)</option>
                    <option value="year-asc">Классика (по году)</option>
                </select>
                <div class="sort-arrow">▼</div>
            </div>
        </div>

        <div id="dynamic-title" class="section-title" style="display: none;"></div>
        <div class="grid" id="main-grid"></div>
    </div>

    <script src="movies_data.js"></script>
    <script src="games_data.js"></script>

    <script>
        let currentSection = 'all';

        function sortData(data, sortType) {
            if (!Array.isArray(data)) return [];
            return [...data].sort((a, b) => {
                try {
                    if (sortType.startsWith('rating')) {
                        let valA = parseFloat(a.rating) || 0;
                        let valB = parseFloat(b.rating) || 0;
                        return sortType.endsWith('desc') ? valB - valA : valA - valB;
                    }
                    if (sortType.startsWith('year')) {
                        let valA = parseInt(a.year) || 0;
                        let valB = parseInt(b.year) || 0;
                        return sortType.endsWith('desc') ? valB - valA : valA - valB;
                    }
                    if (sortType.startsWith('date')) {
                        let parseDate = (dStr) => {
                            if (!dStr) return 0;
                            let parts = String(dStr).split('.');
                            if (parts.length === 3) {
                                return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
                            }
                            return new Date(dStr).getTime() || 0;
                        };
                        let valA = parseDate(a.date);
                        let valB = parseDate(b.date);
                        return sortType.endsWith('desc') ? valB - valA : valA - valB;
                    }
                } catch(e) {
                    return 0;
                }
                return 0;
            });
        }

        // ВОТ ГЛАВНОЕ ИСПРАВЛЕНИЕ:
        function renderCards(data) {
            const container = document.getElementById('main-grid');
            if (!data || data.length === 0) {
                container.innerHTML = ''; 
                return;
            }

            // 1. Создаем пустую текстовую корзину
            let htmlContent = ''; 

            // 2. Складываем весь код в корзину (не трогая сам сайт)
            data.forEach(item => {
                const isGame = item.platform !== undefined || item.hours !== undefined;
                let tagsHTML = '<div class="tags-container">';
                if (item.year) tagsHTML += `<div class="tag">${isGame ? '🕹️' : '🎬'} ${item.year}</div>`;
                if (item.date) tagsHTML += `<div class="tag">👁️ ${item.date}</div>`;
                
                if (isGame) {
                    if (item.platform) tagsHTML += `<div class="tag">🎮 ${item.platform}</div>`;
                    if (item.hours) tagsHTML += `<div class="tag">⏱ ${item.hours}</div>`;
                }
                tagsHTML += '</div>';

                let commentHTML = !isGame && item.comment ? `<div class="details">${item.comment}</div>` : '';
                let ratingParts = (item.rating || "").split('/');
                let mainScore = ratingParts[0];
                let maxScore = ratingParts.length > 1 ? "/" + ratingParts[1] : "";

                let ratingDisplay = mainScore ? `
                    <div class="rating-wrapper">
                        <span class="rating-star rainbow-text">★</span>
                        <span class="rating-value rainbow-text">${mainScore}</span>
                        <span class="rating-max">${maxScore}</span>
                    </div>` : '';

                htmlContent += `
                    <div class="card" title="${item.comment || item.title}">
                        <img src="${item.image}" alt="${item.title}" class="poster" loading="lazy">
                        <div class="info">
                            <h3 class="title">${item.title}</h3>
                            ${tagsHTML}
                            ${commentHTML}
                            ${ratingDisplay}
                        </div>
                    </div>
                `;
            });

            // 3. Выводим готовую корзину на сайт ровно ОДИН РАЗ
            container.innerHTML = htmlContent;
        }

        function refreshGrid() {
            const sortType = document.getElementById('sort-select').value;
            
            let movies = typeof myMovies !== 'undefined' ? myMovies : [];
            let games = typeof myGames !== 'undefined' ? myGames : [];

            let dataToRender = [];
            
            if (currentSection === 'all') {
                dataToRender = [...movies, ...games];
            } else if (currentSection === 'movies') {
                dataToRender = movies;
            } else if (currentSection === 'games') {
                dataToRender = games;
            }

            const sortedData = sortData(dataToRender, sortType);
            renderCards(sortedData);
            applyFilters();
        }

        function showSection(section) {
            document.getElementById('btn-all').classList.remove('active');
            document.getElementById('btn-movies').classList.remove('active');
            document.getElementById('btn-games').classList.remove('active');
            document.getElementById('btn-' + section).classList.add('active');
            
            currentSection = section;
            
            const titleEl = document.getElementById('dynamic-title');
            if (section === 'all') {
                titleEl.style.display = 'none';
            } else if (section === 'movies') {
                titleEl.textContent = 'Фильмы и сериалы';
                titleEl.style.display = 'block';
            } else if (section === 'games') {
                titleEl.textContent = 'Игры';
                titleEl.style.display = 'block';
            }
            
            refreshGrid();
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            document.querySelectorAll('.card').forEach(card => {
                const titleEl = card.querySelector('.title');
                if (titleEl) {
                    const title = titleEl.textContent.toLowerCase();
                    card.style.display = title.includes(query) ? 'flex' : 'none';
                }
            });
        }

        refreshGrid();
        document.getElementById('search-input').addEventListener('input', applyFilters);

    </script>
</body>
</html>
